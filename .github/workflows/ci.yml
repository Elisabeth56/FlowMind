name: CI

on:
  pull_request:
  push:
    branches: [main, remodel]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build only needs the public values; secrets are checked when the server starts.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # A fresh local Supabase with every migration and the seed applied.
      - run: supabase db start
      - run: supabase test db
      # The committed types must describe the same schema the migrations produce, so the
      # schema in git and the types the app compiles against never drift apart. The two
      # files are compared as types, not as text: the generator's formatting changes
      # between CLI versions, the schema it describes must not.
      - name: Types match migrations
        run: |
          mkdir -p /tmp/types
          cp src/types/database.ts /tmp/types/committed.ts
          supabase gen types typescript --local > /tmp/types/generated.ts
          cat > /tmp/types/check.ts <<'TS'
          import type { Database as Committed } from './committed'
          import type { Database as Generated } from './generated'
          type Same<A, B> = [A] extends [B] ? ([B] extends [A] ? true : false) : false
          type C = Committed['public']
          type G = Generated['public']
          // Names what differs, so the failure says where to look: "table.Row.column".
          type Part = 'Row' | 'Insert' | 'Update' | 'Relationships'
          type Columns<A, B, Where extends string> = {
            [K in keyof A & string]: K extends keyof B
              ? Same<A[K], B[K]> extends true ? never : `${Where}.${K}`
              : `${Where}.${K} (only in one file)`
          }[keyof A & string]
          type Tables<A, B> = {
            [T in keyof A & string]: T extends keyof B
              ? { [P in Part]: P extends keyof A[T] & keyof B[T]
                  ? P extends 'Relationships'
                    ? Same<A[T][P], B[T][P]> extends true ? never : `${T}.Relationships`
                    : Columns<A[T][P], B[T][P], `${T}.${P}`> | Columns<Required<A[T][P]>, Required<B[T][P]>, `${T}.${P}`>
                  : never }[Part]
              : `${T} (only in one file)`
          }[keyof A & string]
          type Other<K extends 'Views' | 'Functions' | 'Enums' | 'CompositeTypes'> =
            | Columns<C[K], G[K], K> | Columns<G[K], C[K], K>
          type Differences =
            | Tables<C['Tables'], G['Tables']> | Tables<G['Tables'], C['Tables']>
            | Other<'Views'> | Other<'Functions'> | Other<'Enums'> | Other<'CompositeTypes'>
          // Each difference becomes a missing property, which is how tsc prints the names.
          export const differences: { [K in Differences]: true } = {}
          export const identical: Same<C, G> = true
          TS
          if ! npx -y -p typescript@5 tsc --noEmit --strict --skipLibCheck /tmp/types/check.ts > /tmp/types/out.txt 2>&1; then
            cat /tmp/types/out.txt
            echo "::error title=Types out of date::Run npm run db:types and commit. $(head -c 4000 /tmp/types/out.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi
