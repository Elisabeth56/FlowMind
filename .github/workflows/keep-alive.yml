name: Keep alive

# Supabase pauses a free project after a week without activity. The nightly demo cleanup
# also touches the database, but only when its secret is set right; this does not depend on it.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database whether it is up
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 https://flowmind-sage.vercel.app/api/health
